  C:["Brasil","Marruecos","Haití","Escocia"],

});
const ALL_MATCHES=Object.values(MATCHES).flat();
const FLAGS={"México":"🇲🇽","Sudáfrica":"🇿🇦","Corea del Sur":"🇰🇷","República Checa":"🇨🇿","Canadá":"🇨🇦","Bosnia y Herzegovina":"🇧🇦","Catar":"🇶🇦","Suiza":"🇨🇭","Brasil":"🇧🇷","Marruecos":"🇲🇦","Haití":"🇭🇹","Escocia":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Estados Unidos":"🇺🇸","Paraguay":"🇵🇾","Australia":"🇦🇺","Turquía":"🇹🇷","Alemania":"🇩🇪","Curazao":"🇨🇼","Costa de Marfil":"🇨🇮","Ecuador":"🇪🇨","Países Bajos":"🇳🇱","Japón":"🇯🇵","Suecia":"🇸🇪","Túnez":"🇹🇳","Bélgica":"🇧🇪","Egipto":"🇪🇬","Irán":"🇮🇷","Nueva Zelanda":"🇳🇿","España":"🇪🇸","Cabo Verde":"🇨🇻","Arabia Saudí":"🇸🇦","Uruguay":"🇺🇾","Francia":"🇫🇷","Senegal":"🇸🇳","Iraq":"🇮🇶","Noruega":"🇳🇴","Argentina":"🇦🇷","Argelia":"🇩🇿","Austria":"🇦🇹","Jordania":"🇯🇴","Portugal":"🇵🇹","R.D. del Congo":"🇨🇩","Uzbekistán":"🇺🇿","Colombia":"🇨🇴","Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croacia":"🇭🇷","Ghana":"🇬🇭","Panamá":"🇵🇦"};
const SHORT={"Bosnia y Herzegovina":"Bosnia-Hz.","República Checa":"Rep. Checa","Costa de Marfil":"C. Marfil","Nueva Zelanda":"N. Zelanda","Arabia Saudí":"Arabia S.","Estados Unidos":"EE.UU.","R.D. del Congo":"R.D. Congo","Países Bajos":"P. Bajos","Corea del Sur":"Corea Sur"};

const fl=t=>FLAGS[t]||"🏳️";

const ALL_TEAMS=Object.values(GROUPS).flat().sort((a,b)=>a.localeCompare(b,"es"));
const PTS={CHAMPION:25,RUNNER_UP:15,THIRD:10,SCORER:10,GRP_1ST:6,GRP_2ND:3,EXTRA_TIME:5,PENALTIES:5,TOP_EUR:8,EXACT:4,RESULT:2};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const mkMs=()=>Object.fromEntries(ALL_MATCHES.map(m=>[m.id,{home:0,away:0}]));
const mkResultMs=()=>Object.fromEntries(ALL_MATCHES.map(m=>[m.id,{home:null,away:null}]));
const mkPreds=()=>({champion:"",runnerUp:"",thirdPlace:"",scorer:"",gw:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),gr:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),extraTime:null,penalties:null,topEur:"",ms:mkMs()});
const res1x2=s=>s.home>s.away?"H":s.home<s.away?"A":"D";

function calcGroupStandings(g,ms){
  const teams=GROUPS[g];
  const st=Object.fromEntries(teams.map(t=>[t,{pts:0,gd:0,gf:0}]));
  MATCHES[g].forEach(m=>{
    const s=ms[m.id];if(!s||s.home===null||s.away===null)return;
    const h=Number(s.home)||0,a=Number(s.away)||0;
    st[m.home].gf+=h;st[m.home].gd+=h-a;
    st[m.away].gf+=a;st[m.away].gd+=a-h;
    if(h>a)st[m.home].pts+=3;
    else if(h===a){st[m.home].pts+=1;st[m.away].pts+=1;}
    else st[m.away].pts+=3;
  });
  return teams.slice().sort((a,b)=>{
    if(st[b].pts!==st[a].pts)return st[b].pts-st[a].pts;
    if(st[b].gd!==st[a].gd)return st[b].gd-st[a].gd;
    return st[b].gf-st[a].gf;
  }).map(t=>({name:t,...st[t]}));
}

function calcScore(preds,res){
  if(!res||!preds)return{total:0,bd:{}};
  const bd={};let total=0;
  const add=(k,v)=>{bd[k]=(bd[k]||0)+v;total+=v;};
  if(res.champion&&preds.champion===res.champion)add("fin",PTS.CHAMPION);
  if(res.runnerUp&&preds.runnerUp===res.runnerUp)add("fin",PTS.RUNNER_UP);
  if(res.thirdPlace&&preds.thirdPlace===res.thirdPlace)add("fin",PTS.THIRD);
  if(res.scorer&&preds.scorer?.toLowerCase().trim()===res.scorer?.toLowerCase().trim())add("fin",PTS.SCORER);
  for(const g of Object.keys(GROUPS)){
    if(res.gw?.[g]&&preds.gw?.[g]===res.gw[g])add("grp",PTS.GRP_1ST);
    if(res.gr?.[g]&&preds.gr?.[g]===res.gr[g])add("grp",PTS.GRP_2ND);
  }
  if(res.extraTime!==null&&res.extraTime!==undefined&&preds.extraTime===res.extraTime)add("bonus",PTS.EXTRA_TIME);
  if(res.penalties!==null&&res.penalties!==undefined&&preds.penalties===res.penalties)add("bonus",PTS.PENALTIES);
  if(res.topEur&&preds.topEur===res.topEur)add("bonus",PTS.TOP_EUR);
  const rms=res.ms||{};
  for(const m of ALL_MATCHES){
    const rm=rms[m.id];const pm=preds.ms?.[m.id];
    if(!rm||rm.home===null||rm.away===null)continue;
    if(!pm||pm.home===null||pm.away===null)continue;
    if(pm.home===rm.home&&pm.away===rm.away)add("matches",PTS.EXACT);
    else if(res1x2(pm)===res1x2(rm))add("matches",PTS.RESULT);
  }
  return{total,bd};
}

function getCountdown(){
  const diff=WC_START-new Date();
  if(diff<=0)return{d:0,h:0,m:0,s:0,started:true};
  return{d:Math.floor(diff/86400000),h:Math.floor((diff%86400000)/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000),started:false};
}

  return <div style={{display:"flex",alignItems:"center",gap:4,padding:"7px 0",borderBottom:"1px solid rgba(200,146,42,0.1)"}}>

  </div>;
}

// ── PREDICT ───────────────────────────────────────────────────────────────────
function PredictView({participants,results,onSave,onBack}){
  const[step,setStep]=useState(0);
  const[name,setName]=useState("");
  const[preds,setPreds]=useState(mkPreds());
  const[eId,setEId]=useState(null);
  const[saved,setSaved]=useState(false);
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const TOTAL=10;
  const merge=function(p){return{...mkPreds(),...p,gw:{...mkPreds().gw,...p.gw},gr:{...mkPreds().gr,...p.gr},ms:{...mkMs(),...p.ms}};};
  const selP=function(p){setName(p.name);setEId(p.id);setPreds(merge(p.predictions));setStep(1);};
  const handleNameNext=function(){
    if(!name.trim()){setErr("Por favor escribe tu nombre");return;}
    setErr("");
    const ex=participants.find(function(p){return p.name.toLowerCase().trim()===name.toLowerCase().trim();});
    if(ex){setEId(ex.id);setPreds(merge(ex.predictions));}
    setStep(1);
  };
  const updMs=function(id,s){setPreds(function(p){return{...p,ms:{...p.ms,[id]:s}};});};
  const updGW=function(g,v){setPreds(function(p){return{...p,gw:{...p.gw,[g]:v}};});};
  const updGR=function(g,v){setPreds(function(p){return{...p,gr:{...p.gr,[g]:v}};});};
  const handleSave=async function(){
    setSaving(true);
    try{const id=eId||uuid();await onSave({id,name:name.trim(),predictions:preds,savedAt:new Date().toISOString()});setSaved(true);}
    catch(e){alert("Error al guardar.");}
    setSaving(false);
  };

  if(pastDeadline()){return <div style={{paddingTop:40,textAlign:"center"}}>
    <div style={{fontSize:64,marginBottom:16}}>🔒</div>
    <div style={{fontSize:20,fontWeight:800,color:C.red,marginBottom:8}}>Plazo cerrado</div>
    <div style={{color:C.muted,marginBottom:24,fontSize:14,lineHeight:1.8}}>Las predicciones cerraron el<br/><strong style={{color:C.text}}>10 de junio a medianoche</strong>.</div>
    <Btn onClick={onBack} variant="outline">← Ver ranking</Btn>
  </div>;}

  if(saved){return <div style={{paddingTop:40,textAlign:"center"}}>
    <div style={{fontSize:64,marginBottom:16}}>🎉</div>
    <div style={{fontSize:22,fontWeight:800,color:C.goldL,marginBottom:8}}>¡Predicciones guardadas!</div>
    <div style={{color:C.muted,marginBottom:24,fontSize:14}}>Que la suerte te acompañe, <strong style={{color:C.text}}>{name.trim()}</strong>.</div>
    <Btn onClick={onBack} variant="outline">← Volver al inicio</Btn>
  </div>;}

  return <div style={{paddingTop:16}}>
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12,color:C.muted}}><span>Paso {step+1}/{TOTAL}</span><span>{Math.round(((step+1)/TOTAL)*100)}%</span></div>
      <div style={{height:5,background:C.card2,borderRadius:10,overflow:"hidden"}}><div style={{height:"100%",borderRadius:10,background:"linear-gradient(90deg,"+C.goldL+","+C.gold+")",width:((step+1)/TOTAL*100)+"%",transition:"width 0.3s"}}/></div>
    </div>

    {step===0&&<div>
      <Card style={{marginBottom:16}}>
        <div style={{fontSize:20,fontWeight:800,color:C.goldL,marginBottom:4}}>👤 ¿Quién eres?</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:16}}>Escribe tu nombre para empezar</div>
        <Inp value={name} onChange={function(v){setName(v);setErr("");}} placeholder="Tu nombre completo..."/>
        {err&&<div style={{color:C.red,fontSize:12,marginTop:6}}>{err}</div>}
        {name.trim().length>1&&participants.filter(function(p){return p.name.toLowerCase().includes(name.toLowerCase());}).map(function(p){return <div key={p.id} onClick={()=>selP(p)} style={{marginTop:8,padding:"8px 12px",background:C.goldGlow,border:"1px solid "+C.gold,borderRadius:8,cursor:"pointer",fontSize:13}}>✏️ Continuar como <strong>{p.name}</strong></div>;})}
      </Card>
      <Btn onClick={handleNameNext} full>Continuar →</Btn>
    </div>}

    {step>=1&&step<=6&&(function(){
      const pair=GRP_PAIRS[step-1];const gA=pair[0];const gB=pair[1];
      const rms=results&&results.ms?results.ms:{};
      return <div>
        <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:2}}>⚽ Grupos {gA} y {gB}</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:14}}><span style={{color:C.blue}}>4 pts</span> exacto · <span style={{color:C.goldL}}>2 pts</span> resultado</div>
        {[gA,gB].map(function(g){return <Card key={g} style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:C.goldL,marginBottom:2,fontSize:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}><span>Grupo {g}</span><span style={{fontSize:11,color:C.muted}}>{GROUPS[g].map(fl).join(" ")}</span></div>
          <div style={{fontSize:11,color:C.muted,marginBottom:8}}>{GROUPS[g].join(" · ")}</div>
          {[1,2,3].map(function(j){return <div key={j}>
            <div style={{fontSize:10,color:C.blue,fontWeight:700,marginTop:j>1?10:0,marginBottom:4,letterSpacing:0.5}}>JORNADA {j}{j===3?" · SIMULTÁNEOS":""}</div>
            {MATCHES[g].filter(function(m){return m.j===j;}).map(function(m){return <MatchRow key={m.id} match={m} score={preds.ms[m.id]} onChange={function(s){updMs(m.id,s);}} result={rms[m.id]}/>;})}</div>;})}
          <div style={{borderTop:"1px solid "+C.border,paddingTop:10,marginTop:10}}>
            <StandingsPanel g={g} ms={preds.ms} onUse={function(f,s){updGW(g,f);updGR(g,s);}}/>
            <div style={{fontSize:12,color:C.muted,marginBottom:8}}>O elige manualmente:</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥇 1º</div><TeamSel teams={GROUPS[g]} value={preds.gw[g]} onChange={function(v){updGW(g,v);if(preds.gr[g]===v)updGR(g,"");}} placeholder="1º..."/></div>
              <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥈 2º</div><TeamSel teams={GROUPS[g]} value={preds.gr[g]} onChange={function(v){updGR(g,v);}} excl={preds.gw[g]} placeholder="2º..."/></div>
            </div>
          </div>
        </Card>;})}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn onClick={()=>setStep(function(s){return s-1;})} variant="outline">← Atrás</Btn>
          <Btn onClick={()=>setStep(function(s){return s+1;})} full>Continuar →</Btn>
        </div>
      </div>;
    })()}

    {step===7&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>🏆 Fase Final</div>
      <Card style={{marginBottom:10}}>
        {[{key:"champion",label:"🥇 Campeón",pts:25},{key:"runnerUp",label:"🥈 Subcampeón",pts:15},{key:"thirdPlace",label:"🥉 3er puesto",pts:10}].map(function(item){return <div key={item.key} style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>{item.label}</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+{item.pts} pts</span></div>
          <AllSel value={preds[item.key]} onChange={function(v){setPreds(function(p){return{...p,[item.key]:v};});}} placeholder="Seleccionar equipo..."/>
        </div>;})}</Card>
      <Card style={{marginBottom:10}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>⚽ Máximo goleador</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+10 pts</span></div>
        <Inp value={preds.scorer} onChange={function(v){setPreds(function(p){return{...p,scorer:v};});}} placeholder="Nombre del jugador..."/>
      </Card>
      <div style={{display:"flex",gap:8}}><Btn onClick={()=>setStep(6)} variant="outline">← Atrás</Btn><Btn onClick={()=>setStep(8)} full>Continuar →</Btn></div>
    </div>}

    {step===8&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>🎲 Preguntas Bonus</div>
      <Card style={{marginBottom:10}}>
        <div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,fontWeight:600}}>⏱️ ¿Prórroga en la final?</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+5 pts</span></div>
          <YesNo value={preds.extraTime} onChange={function(v){setPreds(function(p){return{...p,extraTime:v};});}}/>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,fontWeight:600}}>🎯 ¿Se decide por penaltis?</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+5 pts</span></div>
          <YesNo value={preds.penalties} onChange={function(v){setPreds(function(p){return{...p,penalties:v};});}}/>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>🇪🇺 Europeo que llega más lejos</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+8 pts</span></div>
          <EurSel value={preds.topEur} onChange={function(v){setPreds(function(p){return{...p,topEur:v};});}}/>
        </div>
      </Card>
      <div style={{display:"flex",gap:8}}><Btn onClick={()=>setStep(7)} variant="outline">← Atrás</Btn><Btn onClick={()=>setStep(9)} full>Revisar →</Btn></div>
    </div>}

    {step===9&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>👀 Revisar y guardar</div>
      <Card style={{marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:13,color:C.blue,marginBottom:10}}>⚽ Partidos completados</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4}}>
          {Object.keys(GROUPS).map(function(g){
            const f=MATCHES[g].filter(function(m){const s=preds.ms[m.id];return s&&(s.home>0||s.away>0);}).length;
            return <div key={g} style={{padding:"4px 0",fontSize:12,textAlign:"center"}}><span style={{color:C.gold,fontWeight:700}}>G{g}</span><br/><span style={{color:f>0?C.green:C.muted}}>{f}/6</span></div>;
          })}
        </div>
      </Card>
      <Card style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:10}}>🏆 Final & Bonus</div>
        {[["🥇 Campeón",preds.champion],["🥈 Subcampeón",preds.runnerUp],["🥉 3er puesto",preds.thirdPlace],["⚽ Goleador",preds.scorer],["⏱️ Prórroga",preds.extraTime===null?"—":preds.extraTime?"Sí":"No"],["🎯 Penaltis",preds.penalties===null?"—":preds.penalties?"Sí":"No"],["🇪🇺 Mejor europeo",preds.topEur||"—"]].map(function(item){return <div key={item[0]} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid "+C.border,fontSize:13}}>
          <span style={{color:C.muted}}>{item[0]}</span>
          <span style={{color:item[1]&&item[1]!=="—"?C.text:C.red,fontWeight:600}}>{FLAGS[item[1]]||""}{FLAGS[item[1]]?" ":""}{item[1]||"⚠️"}</span>
        </div>;})}</Card>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={()=>setStep(8)} variant="outline">← Editar</Btn>
        <Btn onClick={handleSave} disabled={saving} full>{saving?"💾 Guardando...":"💾 Guardar predicciones"}</Btn>
      </div>
    </div>}
  </div>;
}

// ── DETAIL VIEW ───────────────────────────────────────────────────────────────
function DetailView({p,results}){
  const[tab,setTab]=useState("resumen");
  const rms=results&&results.ms?results.ms:{};

  return <div style={{background:C.card2,border:"1px solid "+C.border,borderTop:"none",borderRadius:"0 0 12px 12px",overflow:"hidden"}}>
    <div style={{display:"flex",background:"rgba(0,0,0,0.2)"}}>
      {[{id:"resumen",label:"📊 Resumen"},{id:"global",label:"🏆 Final & Bonus"},{id:"partidos",label:"⚽ Partidos"}].map(function(t){return <button key={t.id} onClick={()=>setTab(t.id)} style={{...base,flex:1,padding:"8px 4px",border:"none",borderBottom:"2px solid "+(tab===t.id?C.gold:"transparent"),background:"transparent",color:tab===t.id?C.goldL:C.muted,fontSize:11,fontWeight:tab===t.id?700:400,cursor:"pointer"}}>{t.label}</button>;})}</div>

    <div style={{padding:14}}>
      {tab==="resumen"&&<div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:14}}>
          {[{l:"⚽ Partidos",k:"matches"},{l:"📊 Grupos",k:"grp"},{l:"🏆 Final",k:"fin"},{l:"🎲 Bonus",k:"bonus"}].map(function(item){return <div key={item.k} style={{background:C.goldGlow,borderRadius:8,padding:"8px 4px",textAlign:"center"}}>
            <div style={{fontSize:14,fontWeight:800,color:p.score.bd[item.k]>0?C.goldL:C.muted}}>{p.score.bd[item.k]||0}</div>
            <div style={{fontSize:9,color:C.muted,marginTop:2}}>{item.l}</div>
          </div>;})}</div>
        <div style={{fontSize:12,color:C.goldL,fontWeight:700,marginBottom:8}}>Partidos por grupo</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4,marginBottom:8}}>
          {Object.keys(GROUPS).map(function(g){
            var ex=0,ok=0,ko=0;
            MATCHES[g].forEach(function(m){
              var rm=rms[m.id];var pm=p.predictions.ms?p.predictions.ms[m.id]:null;
              if(!rm||rm.home===null)return;
              if(!pm||pm.home===null){ko++;return;}
              if(pm.home===rm.home&&pm.away===rm.away)ex++;
              else if(res1x2(pm)===res1x2(rm))ok++;
              else ko++;
            });
            return <div key={g} style={{fontSize:11,padding:"3px 0",borderBottom:"1px solid "+C.border}}>
              <span style={{color:C.gold,fontWeight:700}}>G{g} </span>
              {ex>0&&<span style={{color:C.green}}>✓{ex} </span>}
              {ok>0&&<span style={{color:C.blue}}>~{ok} </span>}
              {ko>0&&<span style={{color:C.red}}>✗{ko}</span>}
            </div>;
          })}
        </div>
        <div style={{fontSize:10,color:C.muted}}>✓ exacto (4pts) · ~ resultado (2pts) · ✗ incorrecto (0pts)</div>
      </div>}

      {tab==="global"&&<div>
        {[
          {icon:"🥇",label:"Campeón",pred:p.predictions.champion,real:results?results.champion:null},
          {icon:"🥈",label:"Subcampeón",pred:p.predictions.runnerUp,real:results?results.runnerUp:null},
          {icon:"🥉",label:"3er puesto",pred:p.predictions.thirdPlace,real:results?results.thirdPlace:null},
          {icon:"⚽",label:"Goleador",pred:p.predictions.scorer,real:results?results.scorer:null},
          {icon:"🇪🇺",label:"Mejor europeo",pred:p.predictions.topEur,real:results?results.topEur:null},
          {icon:"⏱️",label:"Prórroga",pred:p.predictions.extraTime,real:results?results.extraTime:null,isBoolean:true},
          {icon:"🎯",label:"Penaltis",pred:p.predictions.penalties,real:results?results.penalties:null,isBoolean:true},
        ].map(function(row){
          var known=row.real!==null&&row.real!==undefined&&row.real!=='';
          var match=false;
          if(known&&row.pred!==null&&row.pred!==undefined){
            match=row.isBoolean?row.pred===row.real:String(row.pred).toLowerCase().trim()===String(row.real).toLowerCase().trim();
          }
          var predStr=row.isBoolean?(row.pred===null?"—":row.pred?"Sí":"No"):(row.pred||"—");
          var realStr=row.isBoolean?(row.real===null||row.real===undefined?"":row.real?"Sí":"No"):(row.real||"");
          return <div key={row.label} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 0",borderBottom:"1px solid "+C.border}}>
            <span style={{fontSize:14,width:20}}>{row.icon}</span>
            <span style={{fontSize:11,color:C.muted,width:90,flexShrink:0}}>{row.label}</span>
            <span style={{flex:1,fontSize:12,fontWeight:600,color:C.text}}>{FLAGS[predStr]||""}{FLAGS[predStr]?" ":""}{predStr}</span>
            {known
              ? <span style={{fontSize:11,fontWeight:700,color:match?C.green:C.red}}>{match?"✅":"❌ "+(FLAGS[realStr]||"")+(FLAGS[realStr]?" ":"")+realStr}</span>
              : <span style={{fontSize:10,color:C.muted}}>⏳ Pendiente</span>
            }
          </div>;
        })}
        <div style={{marginTop:12}}>
          <div style={{fontSize:12,color:C.goldL,fontWeight:700,marginBottom:8}}>📊 Clasificados por grupo</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
            {Object.keys(GROUPS).map(function(g){
              var gw=p.predictions.gw?p.predictions.gw[g]:"";
              var gr=p.predictions.gr?p.predictions.gr[g]:"";
              var rw=results&&results.gw?results.gw[g]:null;
              var rr=results&&results.gr?results.gr[g]:null;
              return <div key={g} style={{padding:"4px 6px",background:"rgba(255,255,255,0.02)",borderRadius:6,border:"1px solid "+C.border,fontSize:11}}>
                <span style={{color:C.gold,fontWeight:700}}>G{g} </span>
                <span style={{color:rw?(gw===rw?C.green:C.red):C.text}}>{fl(gw)} {sh(gw||"—")}</span>
                <span style={{color:C.muted}}> · </span>
                <span style={{color:rr?(gr===rr?C.green:C.red):C.text}}>{fl(gr)} {sh(gr||"—")}</span>
              </div>;
            })}
          </div>
        </div>
      </div>}

      {tab==="partidos"&&<div>
        <div style={{fontSize:11,color:C.muted,marginBottom:10}}>
          <span style={{color:C.green}}>●</span> Exacto 4pts &nbsp;
          <span style={{color:C.blue}}>●</span> Resultado 2pts &nbsp;
          <span style={{color:C.red}}>●</span> Incorrecto 0pts &nbsp;
          <span style={{color:C.muted}}>○</span> Pendiente
        </div>
        {Object.keys(GROUPS).map(function(g){return <div key={g} style={{marginBottom:12}}>
          <div style={{fontSize:11,color:C.gold,fontWeight:700,marginBottom:4,paddingBottom:3,borderBottom:"1px solid "+C.border}}>Grupo {g} · {GROUPS[g].map(fl).join(" ")}</div>
          {MATCHES[g].map(function(m){
            var pm=p.predictions.ms?p.predictions.ms[m.id]:null;
            var rm=rms[m.id];
            var played=rm&&rm.home!==null&&rm.away!==null;
            var col=C.muted;var pts=null;
            if(played&&pm&&pm.home!==null){
              if(pm.home===rm.home&&pm.away===rm.away){col=C.green;pts=4;}
              else if(res1x2(pm)===res1x2(rm)){col=C.blue;pts=2;}
              else{col=C.red;pts=0;}
            }
            return <div key={m.id} style={{display:"flex",alignItems:"center",fontSize:11,padding:"3px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}>
              <span style={{flex:1,textAlign:"right",color:C.muted,overflow:"hidden",whiteSpace:"nowrap"}}>{fl(m.home)} {sh(m.home)}</span>
              <span style={{color:col,fontWeight:800,padding:"0 6px",minWidth:34,textAlign:"center",flexShrink:0}}>{pm&&pm.home!==null?(pm.home+"-"+pm.away):"—"}</span>
              <span style={{flex:1,textAlign:"left",color:C.muted,overflow:"hidden",whiteSpace:"nowrap"}}>{sh(m.away)} {fl(m.away)}</span>
              <span style={{fontSize:10,color:C.muted,minWidth:40,textAlign:"center",flexShrink:0}}>{played?"("+rm.home+"-"+rm.away+")":""}</span>
              <span style={{fontSize:10,fontWeight:700,color:col,minWidth:20,textAlign:"right",flexShrink:0}}>{pts!==null?(pts+"p"):""}</span>
            </div>;
          })}
        </div>;})}
      </div>}
    </div>
  </div>;
}

// ── BOARD ─────────────────────────────────────────────────────────────────────
function BoardView({ranked,results}){
  const[exp,setExp]=useState(null);
  return <div style={{paddingTop:20,paddingBottom:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL}}>🏅 Clasificación</div>
      <div style={{fontSize:12,color:C.muted}}>{ranked.length} participante{ranked.length!==1?"s":""}</div>
    </div>
    {ranked.length===0&&<Card style={{textAlign:"center",padding:40}}><div style={{fontSize:44,marginBottom:12}}>👥</div><div style={{color:C.muted}}>Aún no hay participantes.</div></Card>}
    {ranked.map(function(p,i){return <div key={p.id} style={{marginBottom:8}}>
      <div onClick={()=>setExp(exp===p.id?null:p.id)} style={{background:i===0?"linear-gradient(135deg,rgba(200,146,42,0.15),rgba(200,146,42,0.05))":C.card,border:"1px solid "+(i===0?C.gold:C.border),borderRadius:exp===p.id?"12px 12px 0 0":"12px",padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
        <span style={{fontSize:20,width:28,textAlign:"center"}}>{["🥇","🥈","🥉"][i]||<span style={{color:C.muted,fontSize:13}}>{i+1}</span>}</span>
        <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{p.name}</div></div>
        <div style={{textAlign:"right"}}><div style={{fontSize:21,fontWeight:800,color:i===0?C.goldL:C.text}}>{p.score.total}</div><div style={{fontSize:10,color:C.muted}}>/ {MAX_PTS} pts</div></div>
        <span style={{color:C.muted,fontSize:11}}>{exp===p.id?"▲":"▼"}</span>
      </div>
      {exp===p.id&&<DetailView p={p} results={results}/>}
    </div>;})}
  </div>;
}

// ── ADMIN ─────────────────────────────────────────────────────────────────────
function AdminView({results,onSave}){
  const[pin,setPin]=useState("");const[ok,setOk]=useState(false);const[pinErr,setPinErr]=useState("");
  const blank=function(){return{champion:"",runnerUp:"",thirdPlace:"",scorer:"",gw:Object.fromEntries(Object.keys(GROUPS).map(function(g){return[g,""];})),gr:Object.fromEntries(Object.keys(GROUPS).map(function(g){return[g,""];})),extraTime:null,penalties:null,topEur:"",ms:mkResultMs()};};
  const[res,setRes]=useState(function(){return results?{...blank(),...results,gw:{...blank().gw,...results.gw},gr:{...blank().gr,...results.gr},ms:{...blank().ms,...results.ms}}:blank();});
  const[tab,setTab]=useState("matches");
  const[msg,setMsg]=useState("");
  const[saving,setSaving]=useState(false);
  useEffect(function(){if(results)setRes({...blank(),...results,gw:{...blank().gw,...results.gw},gr:{...blank().gr,...results.gr},ms:{...blank().ms,...results.ms}});},[results]);
  const doPin=function(){if(pin===ADMIN_PIN){setOk(true);setPinErr("");}else setPinErr("❌ PIN incorrecto");};
  const doSave=async function(){
    setSaving(true);
    try{await onSave(res);setMsg("✅ ¡Guardado!");setTimeout(function(){setMsg("");},4000);}
    catch(e){alert("Error al guardar.");}
    setSaving(false);
  };
  const updMs=function(id,s){setRes(function(r){return{...r,ms:{...r.ms,[id]:s}};});};
  const updGW=function(g,v){setRes(function(r){return{...r,gw:{...r.gw,[g]:v}};});};
  const updGR=function(g,v){setRes(function(r){return{...r,gr:{...r.gr,[g]:v}};});};

  if(!ok)return <div style={{paddingTop:40,maxWidth:320,margin:"0 auto",textAlign:"center"}}>
    <div style={{fontSize:44,marginBottom:16}}>🔐</div>
    <div style={{fontSize:18,fontWeight:700,color:C.goldL,marginBottom:8}}>Panel Administrador</div>
    <div style={{fontSize:13,color:C.muted,marginBottom:20}}>Solo para el organizador</div>
    <Inp value={pin} onChange={function(v){setPin(v);setPinErr("");}} placeholder="PIN..." type="password"/>
    {pinErr&&<div style={{color:C.red,fontSize:12,marginTop:6}}>{pinErr}</div>}
    <div style={{marginTop:12}}><Btn onClick={doPin} full>Acceder</Btn></div>
  </div>;

  return <div style={{paddingTop:16,paddingBottom:20}}>
    <div style={{fontSize:17,fontWeight:800,color:C.goldL,marginBottom:6}}>⚙️ Resultados Reales</div>
    <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Marca cada partido como jugado para que cuente en el ranking</div>
    {msg&&<div style={{background:"rgba(34,197,94,0.1)",border:"1px solid "+C.green,borderRadius:8,padding:"10px 14px",color:C.green,fontSize:13,marginBottom:12,fontWeight:600}}>{msg}</div>}
    <div style={{display:"flex",gap:0,marginBottom:14,background:C.card2,borderRadius:10,padding:3}}>
      {[{id:"matches",label:"⚽ Partidos"},{id:"global",label:"🏆 Global & Bonus"}].map(function(t){return <button key={t.id} onClick={()=>setTab(t.id)} style={{...base,flex:1,padding:"8px 0",borderRadius:8,border:"none",background:tab===t.id?C.card:"transparent",color:tab===t.id?C.goldL:C.muted,fontSize:13,fontWeight:tab===t.id?700:400,cursor:"pointer"}}>{t.label}</button>;})}</div>

    {tab==="matches"&&<div>
      {Object.keys(GROUPS).map(function(g){return <Card key={g} style={{marginBottom:10}}>
        <div style={{fontWeight:700,color:C.goldL,fontSize:14,marginBottom:4,display:"flex",justifyContent:"space-between"}}><span>Grupo {g}</span><span style={{fontSize:11,color:C.muted}}>{GROUPS[g].map(fl).join(" ")}</span></div>
        {[1,2,3].map(function(j){return <div key={j}>
          <div style={{fontSize:10,color:C.blue,fontWeight:700,marginTop:8,marginBottom:4,letterSpacing:0.5}}>JORNADA {j}{j===3?" · SIMULTÁNEOS":""}</div>
          {MATCHES[g].filter(function(m){return m.j===j;}).map(function(m){return <AdminMatchRow key={m.id} match={m} score={res.ms&&res.ms[m.id]!==undefined?res.ms[m.id]:{home:null,away:null}} onChange={function(s){updMs(m.id,s);}}/>;})}</div>;})}
        <div style={{borderTop:"1px solid "+C.border,paddingTop:10,marginTop:8}}>
          <StandingsPanel g={g} ms={res.ms} onUse={function(f,s){updGW(g,f);updGR(g,s);}}/>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥇 1º</div><TeamSel teams={GROUPS[g]} value={res.gw&&res.gw[g]?res.gw[g]:""} onChange={function(v){updGW(g,v);}} placeholder="1º..."/></div>
            <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥈 2º</div><TeamSel teams={GROUPS[g]} value={res.gr&&res.gr[g]?res.gr[g]:""} onChange={function(v){updGR(g,v);}} excl={res.gw&&res.gw[g]?res.gw[g]:""} placeholder="2º..."/></div>
          </div>
        </div>
      </Card>;})}
      <Btn onClick={doSave} disabled={saving} full>{saving?"Guardando...":"💾 Guardar partidos"}</Btn>
    </div>}

    {tab==="global"&&<div>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:14}}>🏆 Fase final</div>
        {[{key:"champion",label:"🥇 Campeón",pts:25},{key:"runnerUp",label:"🥈 Subcampeón",pts:15},{key:"thirdPlace",label:"🥉 3er puesto",pts:10}].map(function(item){return <div key={item.key} style={{marginBottom:14}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13}}>{item.label}</span><span style={{fontSize:11,color:C.goldL}}>+{item.pts} pts</span></div>
          <AllSel value={res[item.key]||""} onChange={function(v){setRes(function(r){return{...r,[item.key]:v};});}} placeholder="Seleccionar..."/>
        </div>;})}</Card>
      <Card style={{marginBottom:12}}>
        <div style={{fontSize:13,marginBottom:6}}>⚽ Goleador <span style={{color:C.goldL,fontSize:11}}>+10 pts</span></div>
        <Inp value={res.scorer||""} onChange={function(v){setRes(function(r){return{...r,scorer:v};});}} placeholder="Nombre del jugador..."/>
      </Card>
      <Card style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:14}}>🎲 Bonus</div>
        <div style={{marginBottom:16}}><div style={{fontSize:13,marginBottom:8}}>⏱️ ¿Prórroga? <span style={{color:C.goldL,fontSize:11}}>+5 pts</span></div><YesNo value={res.extraTime} onChange={function(v){setRes(function(r){return{...r,extraTime:v};});}}/></div>
        <div style={{marginBottom:16}}><div style={{fontSize:13,marginBottom:8}}>🎯 ¿Penaltis? <span style={{color:C.goldL,fontSize:11}}>+5 pts</span></div><YesNo value={res.penalties} onChange={function(v){setRes(function(r){return{...r,penalties:v};});}}/></div>
        <div><div style={{fontSize:13,marginBottom:8}}>🇪🇺 Mejor europeo <span style={{color:C.goldL,fontSize:11}}>+8 pts</span></div><EurSel value={res.topEur||""} onChange={function(v){setRes(function(r){return{...r,topEur:v};});}}/></div>
      </Card>
      <Btn onClick={doSave} disabled={saving} full>{saving?"Guardando...":"💾 Guardar global & bonus"}</Btn>
    </div>}
  </div>;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState("home");
  const[parts,setParts]=useState([]);
  const[results,setResults]=useState(null);
  const[loading,setLoading]=useState(true);
  const[cd,setCd]=useState(getCountdown());
  useEffect(function(){
    dbLoad().then(function(data){setParts(data.participants);setResults(data.results);setLoading(false);});
    const t=setInterval(function(){setCd(getCountdown());},1000);
    return function(){clearInterval(t);};
  },[]);
  const handleSaveParticipant=async function(entry){
    await dbSaveParticipant(entry);
    setParts(function(prev){const idx=prev.findIndex(function(p){return p.id===entry.id;});if(idx>=0){const u=[...prev];u[idx]=entry;return u;}return[...prev,entry];});
  };
  const handleSaveResults=async function(res){await dbSaveResults(res);setResults(res);};
  const ranked=parts.map(function(p){return{...p,score:calcScore(p.predictions,results)};}).sort(function(a,b){return b.score.total-a.score.total;});

  if(loading)return <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
    <div style={{fontSize:48}}>⚽</div>
    <div style={{color:C.goldL,fontSize:16,fontWeight:700}}>Cargando quiniela...</div>
  </div>;

  return <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Sans',system-ui,sans-serif",color:C.text,paddingBottom:80}}>
    <Header cd={cd}/>
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 14px"}}>
      {view==="home"&&<HomeView ranked={ranked} results={results} onPredict={()=>setView("predict")}/>}
      {view==="predict"&&<PredictView participants={parts} results={results} onSave={handleSaveParticipant} onBack={()=>setView("home")}/>}
      {view==="board"&&<BoardView ranked={ranked} results={results}/>}
      {view==="admin"&&<AdminView results={results} onSave={handleSaveResults}/>}
    </div>
    <Nav view={view} setView={setView} count={parts.length}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
