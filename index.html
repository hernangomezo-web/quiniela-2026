const SHORT={"Bosnia y Herzegovina":"Bosnia-Hz.","República Checa":"Rep. Checa","Costa de Marfil":"C. Marfil","Nueva Zelanda":"N. Zelanda","Arabia Saudí":"Arabia S.","Estados Unidos":"EE.UU.","R.D. del Congo":"R.D. Congo","Países Bajos":"P. Bajos","Corea del Sur":"Corea Sur"};

const fl=t=>FLAGS[t]||"🏳️";

const PTS={CHAMPION:25,RUNNER_UP:15,THIRD:10,SCORER:10,GRP_1ST:6,GRP_2ND:3,EXTRA_TIME:5,PENALTIES:5,TOP_EUR:8,EXACT:4,RESULT:2};

// ── HELPERS ───────────────────────────────────────────────────────────────────
const mkMs=()=>Object.fromEntries(ALL_MATCHES.map(m=>[m.id,{home:0,away:0}]));
const mkPreds=()=>({champion:"",runnerUp:"",thirdPlace:"",scorer:"",gw:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),gr:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),extraTime:null,penalties:null,topEur:"",ms:mkMs()});
const res1x2=s=>s.home>s.away?"H":s.home<s.away?"A":"D";

// ── CLASIFICACIÓN DE GRUPO ────────────────────────────────────────────────────
function calcGroupStandings(g, ms) {
  const teams = GROUPS[g];
  const st = Object.fromEntries(teams.map(t=>[t,{pts:0,gd:0,gf:0,pj:0}]));
  MATCHES[g].forEach(m=>{
    const s=ms[m.id];
    if(!s||s.home===null||s.away===null) return;
    const h=Number(s.home)||0, a=Number(s.away)||0;
    st[m.home].gf+=h; st[m.home].gd+=h-a; st[m.home].pj++;
    st[m.away].gf+=a; st[m.away].gd+=a-h; st[m.away].pj++;
    if(h>a){ st[m.home].pts+=3; }
    else if(h===a){ st[m.home].pts+=1; st[m.away].pts+=1; }
    else{ st[m.away].pts+=3; }
  });
  return teams.slice().sort((a,b)=>{
    if(st[b].pts!==st[a].pts) return st[b].pts-st[a].pts;
    if(st[b].gd!==st[a].gd) return st[b].gd-st[a].gd;
    return st[b].gf-st[a].gf;
  }).map(t=>({name:t,...st[t]}));
}

function calcScore(preds,res){
  if(!res||!preds)return{total:0,bd:{}};
  const bd={};let total=0;
  const add=(k,v)=>{bd[k]=(bd[k]||0)+v;total+=v;};
  if(res.champion&&preds.champion===res.champion)add("fin",PTS.CHAMPION);
  if(res.runnerUp&&preds.runnerUp===res.runnerUp)add("fin",PTS.RUNNER_UP);
  if(res.thirdPlace&&preds.thirdPlace===res.thirdPlace)add("fin",PTS.THIRD);
  if(res.scorer&&preds.scorer?.toLowerCase().trim()===res.scorer?.toLowerCase().trim())add("fin",PTS.SCORER);
  for(const g of Object.keys(GROUPS)){
    if(res.gw?.[g]&&preds.gw?.[g]===res.gw[g])add("grp",PTS.GRP_1ST);
    if(res.gr?.[g]&&preds.gr?.[g]===res.gr[g])add("grp",PTS.GRP_2ND);
  }
  if(res.extraTime!==null&&res.extraTime!==undefined&&preds.extraTime===res.extraTime)add("bonus",PTS.EXTRA_TIME);
  if(res.penalties!==null&&res.penalties!==undefined&&preds.penalties===res.penalties)add("bonus",PTS.PENALTIES);
  if(res.topEur&&preds.topEur===res.topEur)add("bonus",PTS.TOP_EUR);
  const rms=res.ms||{};
  for(const m of ALL_MATCHES){
    const rm=rms[m.id];const pm=preds.ms?.[m.id];
    if(!rm||rm.home===null||rm.away===null)continue;
    if(!pm||pm.home===null||pm.away===null)continue;
    if(pm.home===rm.home&&pm.away===rm.away)add("matches",PTS.EXACT);
    else if(res1x2(pm)===res1x2(rm))add("matches",PTS.RESULT);
  }
  return{total,bd};
}
function getCountdown(){
  const diff=WC_START-new Date();
  if(diff<=0)return{d:0,h:0,m:0,s:0,started:true};
  return{d:Math.floor(diff/86400000),h:Math.floor((diff%86400000)/3600000),m:Math.floor((diff%3600000)/60000),s:Math.floor((diff%60000)/1000),started:false};
}

function MatchRow({match,score,onChange,result}){
  const{home,away}=match;const h=score?.home??0;const a=score?.away??0;
  let hint="";
  if(result&&result.home!==null&&result.away!==null){const exact=h===result.home&&a===result.away;const correctR=!exact&&res1x2({home:h,away:a})===res1x2(result);hint=exact?C.green:correctR?C.blue:C.red;}
  return <div style={{display:"flex",alignItems:"center",gap:4,padding:"7px 0",borderBottom:`1px solid rgba(200,146,42,0.1)`}}>

// ── PREDICT ───────────────────────────────────────────────────────────────────
function PredictView({participants,results,onSave,onBack}){
  const[step,setStep]=useState(0);
  const[name,setName]=useState("");
  const[preds,setPreds]=useState(mkPreds());
  const[eId,setEId]=useState(null);
  const[saved,setSaved]=useState(false);
  const[err,setErr]=useState("");
  const[saving,setSaving]=useState(false);
  const TOTAL=10;
  const merge=p=>({...mkPreds(),...p,gw:{...mkPreds().gw,...p.gw},gr:{...mkPreds().gr,...p.gr},ms:{...mkMs(),...p.ms}});
  const selP=p=>{setName(p.name);setEId(p.id);setPreds(merge(p.predictions));setStep(1);};
  const handleNameNext=()=>{
    if(!name.trim()){setErr("Por favor escribe tu nombre");return;}
    setErr("");
    const ex=participants.find(p=>p.name.toLowerCase().trim()===name.toLowerCase().trim());
    if(ex){setEId(ex.id);setPreds(merge(ex.predictions));}
    setStep(1);
  };
  const updMs=(id,s)=>setPreds(p=>({...p,ms:{...p.ms,[id]:s}}));
  const updGW=(g,v)=>setPreds(p=>({...p,gw:{...p.gw,[g]:v}}));
  const updGR=(g,v)=>setPreds(p=>({...p,gr:{...p.gr,[g]:v}}));
  const handleSave=async()=>{
    setSaving(true);
    try{
      const id=eId||uuid();
      const entry={id,name:name.trim(),predictions:preds,savedAt:new Date().toISOString()};
      await onSave(entry);setSaved(true);
    }catch(e){alert("Error al guardar. Comprueba tu conexión.");}
    setSaving(false);
  };

  if(saved)return <div style={{paddingTop:40,textAlign:"center"}}>
    <div style={{fontSize:64,marginBottom:16}}>🎉</div>
    <div style={{fontSize:22,fontWeight:800,color:C.goldL,marginBottom:8}}>¡Predicciones guardadas!</div>
    <div style={{color:C.muted,marginBottom:24,fontSize:14}}>Que la suerte te acompañe, <strong style={{color:C.text}}>{name.trim()}</strong>.</div>
    <Btn onClick={onBack} variant="outline">← Volver al inicio</Btn>
  </div>;

  return <div style={{paddingTop:16}}>
    <div style={{marginBottom:16}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:12,color:C.muted}}><span>Paso {step+1}/{TOTAL}</span><span>{Math.round(((step+1)/TOTAL)*100)}%</span></div>
      <div style={{height:5,background:C.card2,borderRadius:10,overflow:"hidden"}}><div style={{height:"100%",borderRadius:10,background:`linear-gradient(90deg,${C.goldL},${C.gold})`,width:`${((step+1)/TOTAL)*100}%`,transition:"width 0.3s"}}/></div>
    </div>

    {step===0&&<div>
      <Card style={{marginBottom:16}}>
        <div style={{fontSize:20,fontWeight:800,color:C.goldL,marginBottom:4}}>👤 ¿Quién eres?</div>
        <div style={{fontSize:13,color:C.muted,marginBottom:16}}>Escribe tu nombre para empezar</div>
        <Inp value={name} onChange={v=>{setName(v);setErr("");}} placeholder="Tu nombre completo..."/>
        {err&&<div style={{color:C.red,fontSize:12,marginTop:6}}>{err}</div>}
        {name.trim().length>1&&participants.filter(p=>p.name.toLowerCase().includes(name.toLowerCase())).map(p=>(
          <div key={p.id} onClick={()=>selP(p)} style={{marginTop:8,padding:"8px 12px",background:C.goldGlow,border:`1px solid ${C.gold}`,borderRadius:8,cursor:"pointer",fontSize:13}}>
            ✏️ Continuar como <strong>{p.name}</strong>
          </div>
        ))}
      </Card>
      <Btn onClick={handleNameNext} full>Continuar →</Btn>
    </div>}

    {step>=1&&step<=6&&(()=>{
      const[gA,gB]=GRP_PAIRS[step-1];
      const rms=results?.ms||{};
      return <div>
        <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:2}}>⚽ Grupos {gA} y {gB}</div>
        <div style={{fontSize:12,color:C.muted,marginBottom:14}}><span style={{color:C.blue}}>4 pts</span> exacto · <span style={{color:C.goldL}}>2 pts</span> resultado</div>
        {[gA,gB].map(g=>(
          <Card key={g} style={{marginBottom:12}}>
            <div style={{fontWeight:700,color:C.goldL,marginBottom:2,fontSize:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span>Grupo {g}</span><span style={{fontSize:11,color:C.muted}}>{GROUPS[g].map(fl).join(" ")}</span>
            </div>
            <div style={{fontSize:11,color:C.muted,marginBottom:8}}>{GROUPS[g].join(" · ")}</div>
            {[1,2,3].map(j=>(
              <div key={j}>
                <div style={{fontSize:10,color:C.blue,fontWeight:700,marginTop:j>1?10:0,marginBottom:4,letterSpacing:0.5}}>JORNADA {j}{j===3?" · SIMULTÁNEOS":""}</div>
                {MATCHES[g].filter(m=>m.j===j).map(m=><MatchRow key={m.id} match={m} score={preds.ms[m.id]} onChange={s=>updMs(m.id,s)} result={rms[m.id]}/>)}
              </div>
            ))}

            {/* CLASIFICACIÓN AUTOMÁTICA */}
            <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:10}}>
              <StandingsPanel g={g} ms={preds.ms} onUse={(first,second)=>{updGW(g,first);updGR(g,second);}}/>
              <div style={{fontSize:12,color:C.muted,marginBottom:8}}>O elige manualmente:</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥇 1º clasificado</div><TeamSel teams={GROUPS[g]} value={preds.gw[g]} onChange={v=>{updGW(g,v);if(preds.gr[g]===v)updGR(g,"");}} placeholder="1º..."/></div>
                <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥈 2º clasificado</div><TeamSel teams={GROUPS[g]} value={preds.gr[g]} onChange={v=>updGR(g,v)} excl={preds.gw[g]} placeholder="2º..."/></div>
              </div>
            </div>
          </Card>
        ))}
        <div style={{display:"flex",gap:8,marginTop:4}}>
          <Btn onClick={()=>setStep(s=>s-1)} variant="outline">← Atrás</Btn>
          <Btn onClick={()=>setStep(s=>s+1)} full>Continuar →</Btn>
        </div>
      </div>;
    })()}

    {step===7&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>🏆 Fase Final</div>
      <Card style={{marginBottom:10}}>
        {[{key:"champion",label:"🥇 Campeón",pts:25},{key:"runnerUp",label:"🥈 Subcampeón",pts:15},{key:"thirdPlace",label:"🥉 3er puesto",pts:10}].map(({key,label,pts})=>(
          <div key={key} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>{label}</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+{pts} pts</span></div>
            <AllSel value={preds[key]} onChange={v=>setPreds(p=>({...p,[key]:v}))} placeholder="Seleccionar equipo..."/>
          </div>
        ))}
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>⚽ Máximo goleador</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+10 pts</span></div>
          <Inp value={preds.scorer} onChange={v=>setPreds(p=>({...p,scorer:v}))} placeholder="Nombre del jugador..."/>
        </div>
      </Card>
      <div style={{display:"flex",gap:8}}><Btn onClick={()=>setStep(6)} variant="outline">← Atrás</Btn><Btn onClick={()=>setStep(8)} full>Continuar →</Btn></div>
    </div>}

    {step===8&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>🎲 Preguntas Bonus</div>
      <Card style={{marginBottom:10}}>
        <div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,fontWeight:600}}>⏱️ ¿Prórroga en la final?</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+5 pts</span></div>
          <YesNo value={preds.extraTime} onChange={v=>setPreds(p=>({...p,extraTime:v}))}/>
        </div>
        <div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:13,fontWeight:600}}>🎯 ¿Se decide por penaltis?</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+5 pts</span></div>
          <YesNo value={preds.penalties} onChange={v=>setPreds(p=>({...p,penalties:v}))}/>
        </div>
        <div>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13,fontWeight:600}}>🇪🇺 Europeo que llega más lejos</span><span style={{fontSize:11,color:C.goldL,fontWeight:700}}>+8 pts</span></div>
          <EurSel value={preds.topEur} onChange={v=>setPreds(p=>({...p,topEur:v}))}/>
        </div>
      </Card>
      <div style={{display:"flex",gap:8}}><Btn onClick={()=>setStep(7)} variant="outline">← Atrás</Btn><Btn onClick={()=>setStep(9)} full>Revisar →</Btn></div>
    </div>}

    {step===9&&<div>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL,marginBottom:4}}>👀 Revisar y guardar</div>
      <div style={{fontSize:12,color:C.muted,marginBottom:14}}>Predicciones de <strong style={{color:C.text}}>{name}</strong></div>
      <Card style={{marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:13,color:C.blue,marginBottom:10}}>⚽ Partidos completados</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4}}>
          {Object.keys(GROUPS).map(g=>{
            const f=MATCHES[g].filter(m=>{const s=preds.ms[m.id];return s&&(s.home>0||s.away>0);}).length;
            return <div key={g} style={{padding:"4px 0",fontSize:12,textAlign:"center"}}>
              <span style={{color:C.gold,fontWeight:700}}>G{g}</span><br/>
              <span style={{color:f>0?C.green:C.muted}}>{f}/6</span>
            </div>;
          })}
        </div>
      </Card>
      <Card style={{marginBottom:10}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:10}}>🏆 Clasificados por grupo</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
          {Object.keys(GROUPS).map(g=>(
            <div key={g} style={{padding:"3px 0",borderBottom:`1px solid ${C.border}`,fontSize:12}}>
              <span style={{color:C.gold,fontWeight:700}}>G{g}: </span>
              <span style={{color:preds.gw[g]?C.text:C.red}}>{preds.gw[g]?`${fl(preds.gw[g])} ${sh(preds.gw[g])}`:"⚠️"}</span>
              {preds.gr[g]&&<span style={{color:C.muted}}> · {fl(preds.gr[g])} {sh(preds.gr[g])}</span>}
            </div>
          ))}
        </div>
      </Card>
      <Card style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:10}}>🏆 Final & Bonus</div>
        {[["🥇 Campeón",preds.champion],["🥈 Subcampeón",preds.runnerUp],["🥉 3er puesto",preds.thirdPlace],["⚽ Goleador",preds.scorer],["⏱️ Prórroga",preds.extraTime===null?"—":preds.extraTime?"Sí":"No"],["🎯 Penaltis",preds.penalties===null?"—":preds.penalties?"Sí":"No"],["🇪🇺 Mejor europeo",preds.topEur||"—"]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
            <span style={{color:C.muted}}>{l}</span>
            <span style={{color:v&&v!=="—"?C.text:C.red,fontWeight:600}}>{FLAGS[v]||""}{FLAGS[v]?" ":""}{v||"⚠️"}</span>
          </div>
        ))}
      </Card>
      <div style={{display:"flex",gap:8}}>
        <Btn onClick={()=>setStep(8)} variant="outline">← Editar</Btn>
        <Btn onClick={handleSave} disabled={saving} full>{saving?"💾 Guardando...":"💾 Guardar predicciones"}</Btn>
      </div>
    </div>}
  </div>;
}

function BoardView({ranked,results}){
  const[exp,setExp]=useState(null);
  return <div style={{paddingTop:20,paddingBottom:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
      <div style={{fontSize:18,fontWeight:800,color:C.goldL}}>🏅 Clasificación</div>

    </div>

    {ranked.map((p,i)=>(
      <div key={p.id} style={{marginBottom:8}}>
        <div onClick={()=>setExp(exp===p.id?null:p.id)} style={{background:i===0?`linear-gradient(135deg,rgba(200,146,42,0.15),rgba(200,146,42,0.05))`:C.card,border:`1px solid ${i===0?C.gold:C.border}`,borderRadius:exp===p.id?"12px 12px 0 0":12,padding:"12px 14px",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20,width:28,textAlign:"center"}}>{["🥇","🥈","🥉"][i]||<span style={{color:C.muted,fontSize:13}}>{i+1}</span>}</span>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:14}}>{p.name}</div></div>
          <div style={{textAlign:"right"}}><div style={{fontSize:21,fontWeight:800,color:i===0?C.goldL:C.text}}>{p.score.total}</div><div style={{fontSize:10,color:C.muted}}>/ {MAX_PTS} pts</div></div>
          <span style={{color:C.muted,fontSize:11}}>{exp===p.id?"▲":"▼"}</span>
        </div>
        {exp===p.id&&<div style={{background:C.card2,border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 12px 12px",padding:14}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:12}}>
            {[{l:"⚽ Partidos",k:"matches"},{l:"📊 Grupos",k:"grp"},{l:"🏆 Final",k:"fin"},{l:"🎲 Bonus",k:"bonus"}].map(({l,k})=>(
              <div key={k} style={{background:C.goldGlow,borderRadius:8,padding:"8px 4px",textAlign:"center"}}>
                <div style={{fontSize:14,fontWeight:800,color:p.score.bd[k]>0?C.goldL:C.muted}}>{p.score.bd[k]||0}</div>
                <div style={{fontSize:9,color:C.muted,marginTop:2}}>{l}</div>
              </div>
            ))}
          </div>
          <div style={{fontSize:12,color:C.goldL,fontWeight:700,marginBottom:8}}>Partidos por grupo</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:4}}>
            {Object.keys(GROUPS).map(g=>{
              const rms=results?.ms||{};let ex=0,ok=0,ko=0;
              MATCHES[g].forEach(m=>{
                const rm=rms[m.id];const pm=p.predictions.ms?.[m.id];
                if(!rm||rm.home===null)return;
                if(!pm||pm.home===null){ko++;return;}
                if(pm.home===rm.home&&pm.away===rm.away)ex++;
                else if(res1x2(pm)===res1x2(rm))ok++;
                else ko++;
              });
              return <div key={g} style={{fontSize:11,padding:"3px 0",borderBottom:`1px solid ${C.border}`}}>
                <span style={{color:C.gold,fontWeight:700}}>G{g} </span>
                {ex>0&&<span style={{color:C.green}}>✓{ex} </span>}
                {ok>0&&<span style={{color:C.blue}}>~{ok} </span>}
                {ko>0&&<span style={{color:C.red}}>✗{ko}</span>}
              </div>;
            })}
          </div>
          <div style={{marginTop:8,fontSize:10,color:C.muted}}>✓ exacto · ~ resultado correcto · ✗ incorrecto</div>
        </div>}
      </div>
    ))}
  </div>;
}

function AdminView({results,onSave}){
  const[pin,setPin]=useState("");const[ok,setOk]=useState(false);const[pinErr,setPinErr]=useState("");
  const blank=()=>({champion:"",runnerUp:"",thirdPlace:"",scorer:"",gw:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),gr:Object.fromEntries(Object.keys(GROUPS).map(g=>[g,""])),extraTime:null,penalties:null,topEur:"",ms:mkMs()});

  const[msg,setMsg]=useState("");

  useEffect(()=>{if(results)setRes({...blank(),...results,gw:{...blank().gw,...results.gw},gr:{...blank().gr,...results.gr},ms:{...blank().ms,...results.ms}});},[results]);

  return <div style={{paddingTop:16,paddingBottom:20}}>
    <div style={{fontSize:17,fontWeight:800,color:C.goldL,marginBottom:6}}>⚙️ Resultados Reales</div>
    <div style={{fontSize:12,color:C.muted,marginBottom:12}}>Los puntos se recalculan al guardar</div>
    {msg&&<div style={{background:"rgba(34,197,94,0.1)",border:`1px solid ${C.green}`,borderRadius:8,padding:"10px 14px",color:C.green,fontSize:13,marginBottom:12,fontWeight:600}}>{msg}</div>}
    <div style={{display:"flex",gap:0,marginBottom:14,background:C.card2,borderRadius:10,padding:3}}>
      {[{id:"matches",label:"⚽ Partidos"},{id:"global",label:"🏆 Global & Bonus"}].map(t=>(
        <button key={t.id} onClick={()=>setTab(t.id)} style={{...base,flex:1,padding:"8px 0",borderRadius:8,border:"none",background:tab===t.id?C.card:"transparent",color:tab===t.id?C.goldL:C.muted,fontSize:13,fontWeight:tab===t.id?700:400,cursor:"pointer"}}>{t.label}</button>
      ))}
    </div>

    {tab==="matches"&&<div>
      {Object.keys(GROUPS).map(g=>(
        <Card key={g} style={{marginBottom:10}}>
          <div style={{fontWeight:700,color:C.goldL,fontSize:14,marginBottom:4,display:"flex",justifyContent:"space-between"}}><span>Grupo {g}</span><span style={{fontSize:11,color:C.muted}}>{GROUPS[g].map(fl).join(" ")}</span></div>
          {[1,2,3].map(j=>(
            <div key={j}>
              <div style={{fontSize:10,color:C.blue,fontWeight:700,marginTop:8,marginBottom:4,letterSpacing:0.5}}>JORNADA {j}{j===3?" · SIMULTÁNEOS":""}</div>
              {MATCHES[g].filter(m=>m.j===j).map(m=><MatchRow key={m.id} match={m} score={res.ms?.[m.id]??{home:0,away:0}} onChange={s=>updMs(m.id,s)}/>)}
            </div>
          ))}
          {/* CLASIFICACIÓN EN ADMIN */}
          <div style={{borderTop:`1px solid ${C.border}`,paddingTop:10,marginTop:8}}>
            <StandingsPanel g={g} ms={res.ms} onUse={(first,second)=>{updGW(g,first);updGR(g,second);}}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:8}}>
              <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥇 1º clasificado</div><TeamSel teams={GROUPS[g]} value={res.gw?.[g]||""} onChange={v=>updGW(g,v)} placeholder="1º..."/></div>
              <div><div style={{fontSize:11,color:C.muted,marginBottom:4}}>🥈 2º clasificado</div><TeamSel teams={GROUPS[g]} value={res.gr?.[g]||""} onChange={v=>updGR(g,v)} excl={res.gw?.[g]} placeholder="2º..."/></div>
            </div>
          </div>
        </Card>
      ))}
      <Btn onClick={doSave} disabled={saving} full>{saving?"Guardando...":"💾 Guardar partidos y clasificados"}</Btn>
    </div>}

    {tab==="global"&&<div>
      <Card style={{marginBottom:12}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:14}}>🏆 Fase final</div>
        {[{key:"champion",label:"🥇 Campeón",pts:25},{key:"runnerUp",label:"🥈 Subcampeón",pts:15},{key:"thirdPlace",label:"🥉 3er puesto",pts:10}].map(({key,label,pts})=>(
          <div key={key} style={{marginBottom:14}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}><span style={{fontSize:13}}>{label}</span><span style={{fontSize:11,color:C.goldL}}>+{pts} pts</span></div>
            <AllSel value={res[key]||""} onChange={v=>setRes(r=>({...r,[key]:v}))} placeholder="Seleccionar..."/>
          </div>
        ))}
        <div>
          <div style={{fontSize:13,marginBottom:6}}>⚽ Goleador <span style={{color:C.goldL,fontSize:11}}>+10 pts</span></div>
          <Inp value={res.scorer||""} onChange={v=>setRes(r=>({...r,scorer:v}))} placeholder="Nombre del jugador..."/>
        </div>
      </Card>
      <Card style={{marginBottom:16}}>
        <div style={{fontWeight:700,fontSize:13,color:C.goldL,marginBottom:14}}>🎲 Bonus</div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,marginBottom:8}}>⏱️ ¿Prórroga en la final? <span style={{color:C.goldL,fontSize:11}}>+5 pts</span></div>
          <YesNo value={res.extraTime} onChange={v=>setRes(r=>({...r,extraTime:v}))}/>
        </div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,marginBottom:8}}>🎯 ¿Penaltis? <span style={{color:C.goldL,fontSize:11}}>+5 pts</span></div>
          <YesNo value={res.penalties} onChange={v=>setRes(r=>({...r,penalties:v}))}/>
        </div>
        <div>
          <div style={{fontSize:13,marginBottom:8}}>🇪🇺 Mejor europeo <span style={{color:C.goldL,fontSize:11}}>+8 pts</span></div>
          <EurSel value={res.topEur||""} onChange={v=>setRes(r=>({...r,topEur:v}))}/>
        </div>
      </Card>
      <Btn onClick={doSave} disabled={saving} full>{saving?"Guardando...":"💾 Guardar global & bonus"}</Btn>
    </div>}
  </div>;
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const[view,setView]=useState("home");
  const[parts,setParts]=useState([]);
  const[results,setResults]=useState(null);
  const[loading,setLoading]=useState(true);
  const[cd,setCd]=useState(getCountdown());
  useEffect(()=>{
    dbLoad().then(({participants,results})=>{setParts(participants);setResults(results);setLoading(false);});
    const t=setInterval(()=>setCd(getCountdown()),1000);
    return()=>clearInterval(t);
  },[]);
  const handleSaveParticipant=async(entry)=>{
    await dbSaveParticipant(entry);
    setParts(prev=>{const idx=prev.findIndex(p=>p.id===entry.id);if(idx>=0){const u=[...prev];u[idx]=entry;return u;}return[...prev,entry];});
  };
  const handleSaveResults=async(res)=>{await dbSaveResults(res);setResults(res);};
  const ranked=parts.map(p=>({...p,score:calcScore(p.predictions,results)})).sort((a,b)=>b.score.total-a.score.total);

  if(loading)return <div style={{background:C.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}>
    <div style={{fontSize:48}}>⚽</div>
    <div style={{color:C.goldL,fontSize:16,fontWeight:700}}>Cargando quiniela...</div>
    <div style={{color:C.muted,fontSize:12}}>Conectando con Supabase...</div>
  </div>;

  return <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Sans',system-ui,sans-serif",color:C.text,paddingBottom:80}}>
    <Header cd={cd}/>
    <div style={{maxWidth:680,margin:"0 auto",padding:"0 14px"}}>
      {view==="home"&&<HomeView ranked={ranked} results={results} onPredict={()=>setView("predict")}/>}
      {view==="predict"&&<PredictView participants={parts} results={results} onSave={handleSaveParticipant} onBack={()=>setView("home")}/>}
      {view==="board"&&<BoardView ranked={ranked} results={results}/>}
      {view==="admin"&&<AdminView results={results} onSave={handleSaveResults}/>}
    </div>
    <Nav view={view} setView={setView} count={parts.length}/>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
